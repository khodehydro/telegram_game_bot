[project]
name = "telegram-card-games-bot"
version = "0.1.0"
description = "Persian card games (Pasur & Hokm) for Telegram, built with aiogram 3"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP042"]
